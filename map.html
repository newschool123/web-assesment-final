<div id="map" class="map-container">
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', {
      crs: L.CRS.Simple,
      minZoom: -1
    });
    const bounds = [[0, 0], [1000, 1000]]; 
    L.imageOverlay('daddy.png', bounds).addTo(map);
    map.fitBounds(bounds);
  </script>
